<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand operations</title>
<style>
:root{--bg:#f5f6f4;--panel:#fff;--ink:#17202a;--mute:#5d6975;--line:#dfe3e0;--accent:#1c4fd6;--up:#17794a;--dn:#b8362b}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--panel:#1b2025;--ink:#e8ecef;--mute:#98a3ad;--line:#2c343b;--accent:#7da2ff;--up:#52c58a;--dn:#ff8a7d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:1080px;margin:0 auto;padding:24px 20px 56px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:baseline;margin-bottom:20px}
h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em}
.note{color:var(--mute);font-size:13px}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:24px}
.strip div{padding:14px 16px 12px 0}
.strip .n{font-size:28px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.15}
.strip .l{color:var(--mute);font-size:13px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav button{font:inherit;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:8px 12px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
thead th{font-size:13px;font-weight:500;color:var(--mute)}
th:first-child{text-align:left;font-weight:600}
.d{display:block;font-size:12px;font-weight:400}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--mute)}
.err{padding:16px;border:1px solid var(--dn);border-radius:8px;color:var(--dn);background:var(--panel)}
.foot{margin-top:12px}
.tasks th,.tasks td{text-align:left;white-space:normal;vertical-align:top}
.tasks ul{margin:6px 0 0;padding-left:18px;color:var(--mute);font-size:13px}
.pr{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;border:1px solid var(--line)}
.pr.high{color:var(--dn);border-color:var(--dn)}.pr.low{color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:12px}
.btn{font:inherit;background:var(--accent);color:var(--panel);border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.grp th,.grp td{background:var(--bg);font-weight:650}
th.ind{padding-left:28px;font-weight:500}
.sort{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--accent)}
input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:1px 4px 1px 10px;margin:0 6px 6px 0;font-size:13px}
.chip .x{border:0;background:none;color:var(--mute);cursor:pointer;font:inherit}
form.inline{display:inline-flex;gap:6px}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Brand operations</h1><div class="note" id="sub">Loading...</div></div>
  <label class="note">Category <select id="cat"><option value="">All categories</option></select></label>
  <label class="note">Period <select id="days"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="60">Last 60 days</option></select> <a id="dos" href="/dossier?days=30" target="_blank" rel="noopener">Open dossier</a> <a id="dosd" href="/dossier?days=30&download=1">Download</a> <button id="demo" hidden>Try demo data</button></label>
</header>
<section class="strip" id="strip" aria-label="Portfolio totals"></section>
<nav role="tablist" id="tabs"></nav>
<div id="view" role="tabpanel"></div>
<p class="note foot" id="foot"></p>
</main>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = {
  money: v => v == null ? 'n/a' : (v < 0 ? '-' : '') + '$' + (Math.abs(v) >= 1e6 ? (Math.abs(v)/1e6).toFixed(2) + 'M' : Math.abs(v) >= 1e3 ? (Math.abs(v)/1e3).toFixed(1) + 'k' : Math.abs(v).toFixed(0)),
  x: v => v == null ? 'n/a' : v.toFixed(2),
  pct: v => v == null ? 'n/a' : (v * 100).toFixed(1) + '%',
  int: v => v == null ? 'n/a' : Math.round(v).toLocaleString(),
};
const C = (label, key, f, dk, good) => ({label, key, f, dk, good});
const TABS = {
  scorecard: ['Scorecard', [C('Profit','profit','money','rel'), C('ROAS','roas','x','abs'), C('Conversion','conversion_rate','pct','pt'), C('AI citations','citation_share','pct','pt'), C('Rating','rating','x','abs'), C('Crawler errors','bot_errors','int','rel','down')]],
  actions: ['Actions', null],
  brands: ['Brands', null],
  media: ['Media buying', [C('Ad spend','spend','money','rel','none'), C('Revenue','revenue','money','rel'), C('Profit','profit','money','rel'), C('ROAS','roas','x','abs')]],
  geo: ['GEO and search', [C('AI citations','citation_share','pct','pt'), ...['chatgpt','gemini','perplexity'].map(e => ({label: e[0].toUpperCase()+e.slice(1), f:'pct', get: (b, w) => w === 'current' ? (b.engines[e] ?? null) : null})), C('Visits from AI','ai_sessions','int','rel'), C('Crawler hits','bot_hits','int','rel'), C('Crawler errors','bot_errors','int','rel','down')]],
  reputation: ['Reputation', [C('Rating','rating','x','abs'), C('Reviews','reviews','int','rel'), C('Negative share','negative_share','pct','pt','down'), C('Reply rate','reply_rate','pct','pt')]],
  status: ['Data status', null],
};
let tab = 'scorecard', data = null, status = null, cat = '', sortCol = null, sortDir = -1;

function delta(cur, prev, c) {
  if (cur == null || prev == null) return '';
  let d = cur - prev, txt;
  if (c.dk === 'rel') { if (!prev) return ''; d = d / Math.abs(prev); txt = (d >= 0 ? '+' : '') + (d*100).toFixed(0) + '%'; }
  else if (c.dk === 'pt') txt = (d >= 0 ? '+' : '') + (d*100).toFixed(1) + ' pt';
  else txt = (d >= 0 ? '+' : '') + d.toFixed(2);
  const sign = Math.abs(d) < 1e-9 ? 0 : (d > 0 ? 1 : -1) * (c.good === 'down' ? -1 : 1);
  const cls = c.good === 'none' || sign === 0 ? 'fl' : sign > 0 ? 'up' : 'dn';
  return `<span class="d ${cls}">${txt}</span>`;
}
const val = (c, b, w) => c.get ? c.get(b, w) : b[w][c.key];

const catLabel = id => ((data && data.categories || []).find(c => c.id === id) || {label: id || 'Uncategorized'}).label;
const visibleBrands = () => data.brands.filter(b => !cat || b.category === cat);
function dossierLinks() {
  const q = '/dossier?days=' + $('#days').value + (cat ? '&category=' + encodeURIComponent(cat) : '');
  $('#dos').href = q; $('#dosd').href = q + '&download=1';
}
const cell = (c, o) => { const cur = val(c, o, 'current'), prev = val(c, o, 'previous'); return `<td>${fmt[c.f](cur)}${c.dk ? delta(cur, prev, c) : ''}</td>`; };
function table(cols, brands) {
  const head = '<tr><th>Brand</th>' + cols.map((c, i) => `<th><button class="sort" data-sort="${i}">${c.label}${sortCol === i ? (sortDir < 0 ? ' &#9660;' : ' &#9650;') : ''}</button></th>`).join('') + '</tr>';
  const groups = cat ? data.categories.filter(c => c.id === cat) : data.categories;
  let body = '';
  for (const g of groups) {
    let bs = brands.filter(b => b.category === g.id);
    if (!bs.length) continue;
    if (sortCol !== null) {
      const c = cols[sortCol];
      bs = [...bs].sort((a, b) => { const x = val(c, a, 'current'), y = val(c, b, 'current'); return x == null ? 1 : y == null ? -1 : (x - y) * sortDir; });
    }
    body += `<tr class="grp"><th scope="row">${esc(g.label)} <span class="note">${bs.length} ${bs.length === 1 ? 'brand' : 'brands'}</span></th>${cols.map(c => cell(c, g)).join('')}</tr>`;
    body += bs.map(b => `<tr><th scope="row" class="ind">${esc(b.name)}</th>${cols.map(c => cell(c, b)).join('')}</tr>`).join('');
  }
  return `<div class="scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
function renderStrip() {
  const p = cat ? data.categories.find(c => c.id === cat) : data.portfolio;
  const items = TABS.scorecard[1];
  $('#strip').innerHTML = items.map(c => `<div><div class="n">${fmt[c.f](val(c, p, 'current'))}</div><div class="l">${c.label}${delta(val(c, p, 'current'), val(c, p, 'previous'), c)}</div></div>`).join('');
}

async function renderView() {
  const v = $('#view');
  if (tab === 'actions') { await renderActions(); }
  else if (tab === 'brands') { await renderBrands(); }
  else if (tab === 'status') { await renderStatus(); } else v.innerHTML = table(TABS[tab][1], visibleBrands());
  $('#tabs').innerHTML = Object.entries(TABS).map(([k, [name]]) => `<button role="tab" aria-selected="${k === tab}" data-t="${k}">${name}</button>`).join('');
}

async function renderBrands(msg) {
  const r = await (await fetch('/api/brands')).json();
  const opt = sel => r.categories.map(c => `<option value="${esc(c.id)}"${c.id === sel ? ' selected' : ''}>${esc(c.label)}</option>`).join('');
  const rows = r.brands.filter(b => !cat || b.category === cat).map(b => `<tr><th scope="row">${esc(b.name)}<div class="note">${esc(b.id)}${b.active ? '' : ', archived'}</div></th><td><select data-cat="${esc(b.id)}" aria-label="Category for ${esc(b.name)}">${opt(b.category)}</select></td><td>${b.sites.map(x => `<span class="chip">${esc(x)} <button class="x" data-act="rmsite" data-id="${esc(b.id)}" data-d="${esc(x)}" aria-label="Remove ${esc(x)}">x</button></span>`).join('') || '<span class="note">No sites </span>'}<form class="inline" data-id="${esc(b.id)}"><input name="domain" placeholder="example.com" aria-label="Add a site to ${esc(b.name)}"><button>Add site</button></form></td><td><button data-act="${b.active ? 'archive' : 'restore'}" data-id="${esc(b.id)}">${b.active ? 'Archive' : 'Restore'}</button></td></tr>`).join('');
  $('#view').innerHTML = `<form id="nb" class="bar"><input name="name" placeholder="New brand name" required aria-label="Brand name"><select name="category" aria-label="Category">${opt(r.categories[0].id)}</select><button class="btn">Add brand</button><span class="note" id="msg">${esc(msg || 'Archiving hides a brand but keeps its data. Sites are also used to match Trustpilot reviews to brands.')}</span></form><div class="scroll"><table class="tasks"><thead><tr><th>Brand</th><th>Category</th><th>Sites</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function saveBrand(path, body) {
  const res = await (await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})).json();
  if (res.error) { await renderBrands(res.error); return; }
  await load();
  const m = $('#msg'); if (m) m.textContent = 'Saved.';
}
const when = v => { if (!v) return 'never'; const t = String(v).replace(' ', 'T'); const d = new Date(/(Z|[+-]\d\d:?\d\d)$/.test(t) ? t : t + 'Z'); return isNaN(d) ? esc(String(v)) : esc(d.toLocaleString()); };
async function renderStatus(msg) {
  const [info, st] = await Promise.all([fetch('/api/info').then(r => r.json()), fetch('/api/status').then(r => r.json())]);
  const by = Object.fromEntries((st.error ? [] : st).map(x => [x.connector, x]));
  const rows = info.sources.map(s => { const x = by[s.id] || {}; return `<tr><th scope="row">${esc(s.label)}<div class="note">${esc(s.folder)}</div></th><td>${when(x.last_success)}</td><td>${x.rows_loaded ?? 'n/a'}</td><td>${esc(x.last_error || 'none')}</td><td><button data-imp="${esc(s.id)}"${info.demo ? ' disabled' : ''}>Import now</button></td></tr>`; }).join('');
  $('#view').innerHTML = `<div class="bar"><span class="note">${esc(info.demo ? 'Demo mode: importing is turned off.' : 'Put exported files in ' + info.inbox + ', in the folder shown under each source.')}</span>${info.desktop ? '<button id="of">Open data folder</button>' : ''}<label class="note">Import window <select id="win"><option value="30">30 days</option><option value="90" selected>90 days</option><option value="365">1 year</option></select></label><span class="note" id="msg">${esc(msg || '')}</span></div><div class="scroll"><table class="tasks"><thead><tr><th>Source</th><th>Last import</th><th>Rows</th><th>Last error</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function renderActions() {
  const v = $('#view'), days = $('#days').value;
  v.innerHTML = '<p class="note">Checking the numbers...</p>';
  const r = await (await fetch('/api/tasks?days=' + days)).json();
  if (r.error) { v.innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  r.tasks = r.tasks.filter(t => !cat || t.category === cat);
  const state = r.jira.configured ? 'Jira is connected.' : r.demo ? 'Demo data: creating tasks is simulated and nothing is sent to Jira.' : 'Jira is not connected. Download the CSV to import, or see docs/jira.md.';
  if (!r.tasks.length) { v.innerHTML = '<p>No actions needed. No brand crossed a threshold in this period.</p>'; return; }
  const rows = r.tasks.map(t => `<tr><td>${t.ticket ? '' : `<input type="checkbox" class="pick" value="${esc(t.key)}" aria-label="Select: ${esc(t.title)}">`}</td><td><span class="pr ${t.priority.toLowerCase()}">${t.priority}</span></td><td><strong>${esc(t.title)}</strong><div class="note">${esc(t.why)}</div><ul>${t.actions.map(a => `<li>${esc(a)}</li>`).join('')}</ul></td><td>${esc(t.function)}<div class="note">${esc(catLabel(t.category))}</div></td><td>${t.ticket ? esc(t.ticket) : 'New'}</td></tr>`).join('');
  v.innerHTML = `<div class="bar"><button class="btn" id="mk">Create selected tasks</button><a href="/api/tasks.csv?days=${days}">Download CSV for Jira import</a><span class="note" id="msg">${state}</span></div><div class="scroll"><table class="tasks"><thead><tr><th>Create</th><th>Priority</th><th>Task</th><th>Owner</th><th>Ticket</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  $('#mk').onclick = async () => {
    const keys = [...document.querySelectorAll('.pick:checked')].map(i => i.value);
    if (!keys.length) { $('#msg').textContent = 'Select at least one task.'; return; }
    $('#mk').disabled = true;
    const res = await (await fetch('/api/tasks/create', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({keys, days: +days})})).json();
    if (res.error) { $('#msg').textContent = res.error; $('#mk').disabled = false; return; }
    const bad = res.results.filter(x => x.error);
    await renderActions();
    $('#msg').textContent = (res.results.length - bad.length) + ' created.' + (bad.length ? ' Failed: ' + bad.map(x => x.key + ' (' + x.error + ')').join('; ') : '');
  };
}
const $ = s => document.querySelector(s);
async function load() {
  try {
    const days = $('#days').value;
    const [s, st] = await Promise.all([fetch('/api/summary?days=' + days), fetch('/api/status')]);
    data = await s.json(); status = await st.json();
    if (data.error) throw new Error(data.error);
    if (status.error) status = [];
    const sel = $('#cat'), keep = sel.value;
    sel.innerHTML = '<option value="">All categories</option>' + data.categories.map(c => `<option value="${esc(c.id)}">${esc(c.label)}</option>`).join('');
    sel.value = data.categories.some(c => c.id === keep) ? keep : ''; cat = sel.value;
    dossierLinks();
    const p0 = data.portfolio.current, empty = !data.demo && p0.profit == null && p0.citation_share == null && p0.rating == null;
    $('#sub').textContent = empty ? 'No data yet. Import exported files from Data status, or try the demo data.' : (data.demo ? 'Demo data. ' : '') + `Compared with the previous ${data.days} days, to ${data.end}.`;
    const db = $('#demo'); db.hidden = !data.desktop; db.textContent = data.demo ? 'Leave demo data' : 'Try demo data';
    $('#foot').textContent = 'Profit is ad revenue minus ad spend (provisional until the profit definition is agreed). Revenue is platform-reported.';
    renderStrip(); await renderView();
  } catch (e) {
    $('#view').innerHTML = `<div class="err">Could not load data: ${esc(e.message)}. Start the server with "python -m app.server --demo", or set DATABASE_URL.</div>`;
  }
}
$('#tabs').addEventListener('click', e => { const t = e.target.closest('button'); if (t && data) { tab = t.dataset.t; sortCol = null; renderView(); } });
$('#days').addEventListener('change', load);
$('#view').addEventListener('click', async e => {
  const imp = e.target.closest('button[data-imp]');
  if (imp) {
    imp.disabled = true;
    const res = await (await fetch('/api/sync', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({connector: imp.dataset.imp, days: +$('#win').value})})).json();
    if (res.error) { await renderStatus(res.error); return; }
    await load();
    const m = $('#msg'); if (m) m.textContent = 'Imported ' + res.rows + ' rows.';
  }
  if (e.target.closest('#of')) {
    const r = await (await fetch('/api/open-folder', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'})).json();
    const m = $('#msg'); if (m && r.error) m.textContent = r.error;
  }
});
$('#demo').addEventListener('click', async () => {
  await fetch('/api/demo', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({on: !data.demo})});
  await load();
});
$('#cat').addEventListener('change', e => { cat = e.target.value; if (data) { dossierLinks(); renderStrip(); renderView(); } });
$('#view').addEventListener('change', e => {
  const sel = e.target.closest('select[data-cat]');
  if (sel) saveBrand('/api/brands/category', {id: sel.dataset.cat, category: sel.value});
});
$('#view').addEventListener('click', e => {
  const sb = e.target.closest('button[data-sort]'); if (!sb) return;
  const i = +sb.dataset.sort; sortDir = sortCol === i ? -sortDir : -1; sortCol = i; renderView();
});
$('#view').addEventListener('submit', e => {
  e.preventDefault(); const f = e.target, fd = Object.fromEntries(new FormData(f));
  if (f.id === 'nb') saveBrand('/api/brands', fd); else if (f.dataset.id) saveBrand('/api/brands/site', {id: f.dataset.id, domain: fd.domain});
});
$('#view').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const {act: kind, id, d} = b.dataset;
  if (kind === 'rmsite') saveBrand('/api/brands/site/remove', {id, domain: d});
  else if (kind === 'archive' && confirm('Archive this brand? It disappears from the views, but its data is kept.')) saveBrand('/api/brands/archive', {id, active: false});
  else if (kind === 'restore') saveBrand('/api/brands/archive', {id, active: true});
});
load();
</script>
</body>
</html>
