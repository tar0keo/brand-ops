# Tracked GEO prompts. Curate this list; it is the core asset of the GEO module.
engines: [chatgpt, gemini, perplexity, google_ai_overviews, claude]
prompts:
  - id: fla_discovery_1
    brand_id: fla
    intent: discovery        # discovery | comparison | trust | brand_name
    text: "best [category] for [use case]"
    weight: 3                # commercial value, 1 to 5
  - id: fla_trust_1
    brand_id: fla
    intent: trust
    text: "is [brand] legit"
    weight: 4
