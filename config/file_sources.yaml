# Settings for connectors that read exported files from data_inbox/.

google_ads:
  # Column names exactly as they appear in your Google Ads export.
  columns: {day: Day, campaign: Campaign, cost: Cost, clicks: Clicks, impressions: "Impr.", conversions: Conversions, conv_value: "Conv. value"}
  # First matching rule wins. Every campaign must match a rule, or the run stops and lists the ones that don't.
  campaign_rules: []
  #  - {contains: "FLA", brand_id: fla}
  #  - {contains: "Paiio", brand_id: paiio}

geo_tracker:
  # Vendor exports differ. Edit these to match your tracker's column names.
  # Use "brand" if the export has a brand column; otherwise prompts are matched against config/prompts.yaml.
  columns: {date: Date, engine: Engine, prompt: Prompt, mentioned: Mentioned, brand: Brand}
  mentioned_values: ["yes", "true", "1", "mentioned", "y"]

bot_logs:
  # Substring of the user agent (case-insensitive) -> label
  bots:
    GPTBot: gptbot
    ChatGPT-User: chatgpt_user
    OAI-SearchBot: oai_searchbot
    PerplexityBot: perplexitybot
    Perplexity-User: perplexity_user
    ClaudeBot: claudebot
    Claude-User: claude_user
    Claude-SearchBot: claude_searchbot
    CCBot: ccbot
    Bytespider: bytespider
    Amazonbot: amazonbot
    meta-externalagent: meta_externalagent
