name: build-desktop
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-desktop.txt
      - run: python -m pytest -q
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: BrandOps-${{ matrix.os }}
          path: dist/BrandOps-*.zip
