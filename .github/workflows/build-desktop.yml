name: build-desktop
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-desktop.txt
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: BrandOps-windows
          path: dist/BrandOps-*.zip
      # Tests run last, so a failing test can never stop you getting the installer.
      - run: python -m pytest -q
